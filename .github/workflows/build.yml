# Tests on Windows and macOS, then builds the Windows zip and the two Mac app zips. On a v* tag the zips go to
# that release (created as a draft when it does not exist yet). Every action is pinned to a commit; the comment
# names its release.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Avalonia's build tasks send usage data unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PrinterHelper.slnx
      - name: Build
        run: dotnet build PrinterHelper.slnx -c Release --no-restore
      - name: Test
        run: dotnet run --project tests/PrinterHelper.Tests -c Release --no-build -- --out "$RUNNER_TEMP/test-out"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-out-${{ matrix.os }}
          path: ${{ runner.temp }}/test-out
          if-no-files-found: ignore

  package-mac:
    name: package (${{ matrix.rid }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, rid: osx-arm64, arch: arm64, suffix: mac-arm64, upload: true }
          - { os: macos-15-intel, rid: osx-x64, arch: x86_64, suffix: mac-x64, upload: true }
          # The arm64 app again, built and opened on the newest macOS; only the macos-15 zip is uploaded.
          - { os: macos-26, rid: osx-arm64, arch: arm64, suffix: mac-arm64, upload: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: version
        run: |
          version=$(dotnet msbuild src/PrinterHelper/PrinterHelper.csproj -getProperty:Version | tr -d '\r')
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: >-
          dotnet publish src/PrinterHelper/PrinterHelper.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishReadyToRun=true -p:DebugType=none -o out/pub
      - name: Icon
        run: packaging/macos/make-icns.sh packaging/macos/icon-1024.png out/PrinterHelper.icns
      - name: App bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/macos/make-app.sh out/pub out "$VERSION" out/PrinterHelper.icns
      - name: Check architectures
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Universal libraries (Skia, HarfBuzz, Avalonia) carry both; every Mach-O must at least have ours.
          status=0
          count=0
          while IFS= read -r -d '' file; do
            kind=$(file -b "$file")
            if [[ $kind == Mach-O* ]]; then
              count=$((count + 1))
              archs=$(lipo -archs "$file")
              case " $archs " in
                *" $ARCH "*) echo "$archs  ${file#out/}" ;;
                *) echo "::error::${file#out/} is $archs, not $ARCH"; status=1 ;;
              esac
            fi
          done < <(find out/PrinterHelper.app -type f -print0)
          if [[ $count -eq 0 ]]; then echo "::error::no Mach-O files in the bundle"; status=1; fi
          exit $status
      - name: Smoke test (direct)
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/smoke-direct"
          mkdir -p "$dir"
          status=0
          out/PrinterHelper.app/Contents/MacOS/PrinterHelper --smoke-test "$dir" || status=$?
          cat "$dir/result.json" 2>/dev/null || echo "no result.json"
          echo "exit code $status"
          test "$status" -eq 0
          test -f "$dir/ok"
      - name: Zip
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="out/PrinterHelper-$VERSION-${{ matrix.suffix }}.zip"
          # The .dll signatures live in extended attributes; ditto stores them (in __MACOSX) and Finder's
          # Archive Utility puts them back.
          ditto -c -k --sequesterRsrc --keepParent out/PrinterHelper.app "$zip"
          echo "path=$zip" >> "$GITHUB_OUTPUT"
          ls -l "$zip"
      - name: Check the zip
        env:
          ZIP: ${{ steps.zip.outputs.path }}
        run: |
          rm -rf "$RUNNER_TEMP/unzipped"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/unzipped"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/unzipped/PrinterHelper.app"
          resources="$RUNNER_TEMP/unzipped/PrinterHelper.app/Contents/Resources"
          for file in LICENSE THIRD-PARTY-NOTICES.md licenses/README.txt licenses/pdfium/pdfium.txt; do
            test -s "$resources/$file" || { echo "::error::$file is missing from the app"; exit 1; }
          done
      - name: Display name (informational)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # The base name is the file name, PrinterHelper; a Korean Mac shows the name from ko.lproj.
          app="$RUNNER_TEMP/unzipped/PrinterHelper.app"
          plutil -p "$app/Contents/Resources/ko.lproj/InfoPlist.strings"
          mdls -name kMDItemDisplayName "$app" || true
          osascript -l JavaScript -e 'ObjC.import("Foundation");
            function run(argv) { return $.NSFileManager.defaultManager.displayNameAtPath(argv[0]).js; }' "$app" || true
      - name: Smoke test (open, from the zip)
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/smoke-open"
          mkdir -p "$dir"
          open -W -n "$RUNNER_TEMP/unzipped/PrinterHelper.app" --args --smoke-test "$dir"
          cat "$dir/result.json" 2>/dev/null || echo "no result.json"
          test -f "$dir/ok"
      - name: Upload zip
        if: matrix.upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.rid }}-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/smoke-direct
            ${{ runner.temp }}/smoke-open
          if-no-files-found: ignore

  package-windows:
    name: package (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: version
        run: |
          $version = "$(dotnet msbuild src/PrinterHelper/PrinterHelper.csproj -getProperty:Version)".Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Output "::error::tag $env:GITHUB_REF_NAME does not match the project version $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish
        run: >-
          dotnet publish src/PrinterHelper/PrinterHelper.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o out/pub
      - name: Smoke test
        timeout-minutes: 5
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'smoke-win'
          New-Item -ItemType Directory -Force $dir | Out-Null
          # ArgumentList quotes each argument itself; the app is a GUI exe, so wait on the process, not a console.
          $start = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path out/pub/PrinterHelper.exe).Path)
          $start.ArgumentList.Add('--smoke-test')
          $start.ArgumentList.Add($dir)
          $process = [System.Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(120000)) {
            $process.Kill($true)
            throw 'the smoke test did not finish within 2 minutes'
          }
          Get-Content (Join-Path $dir 'result.json') -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "the smoke test exited with $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'ok'))) { throw 'the smoke test wrote no ok file' }
      - name: Zip
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "out/PrinterHelper-$env:VERSION-win-x64.zip"
          $stage = 'out/zip'
          New-Item -ItemType Directory -Force "$stage/cli" | Out-Null
          Copy-Item out/pub/* $stage -Recurse
          Copy-Item LICENSE, README.md, THIRD-PARTY-NOTICES.md $stage
          Copy-Item cli/scan.bat, cli/scan.ps1 "$stage/cli"
          # The PDFium texts and the license files of the packages in this publish (Skia, HarfBuzz, the runtime...).
          python packaging/copy-notices.py win-x64 "$stage/licenses"
          if ($LASTEXITCODE -ne 0) { throw "copying the third-party notices failed ($LASTEXITCODE)" }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          "path=$zip" >> $env:GITHUB_OUTPUT
          Get-ChildItem $stage -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName }
      - name: Upload zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.zip.outputs.path }}
          archive: false
          if-no-files-found: error
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-win-x64
          path: ${{ runner.temp }}/smoke-win
          if-no-files-found: ignore

  # One job attaches all three zips, so the package jobs do not race to create the release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package-mac, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: PrinterHelper-*.zip
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find dist -type f -name 'PrinterHelper-*.zip' | sort)
          printf '%s\n' "${files[@]}"
          if [[ ${#files[@]} -ne 3 ]]; then
            echo "::error::expected 3 zips (win-x64, mac-arm64, mac-x64), found ${#files[@]}"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            version=${TAG#v}
            notes="Windows: PrinterHelper-$version-win-x64.zip
          Mac (Apple 실리콘): PrinterHelper-$version-mac-arm64.zip
          Mac (Intel): PrinterHelper-$version-mac-x64.zip

          Mac 판은 시험판입니다. 처음 여는 방법: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/packaging/macos/README.md"
            gh release create "$TAG" --draft --verify-tag --title "프린터 도우미 $version" --notes "$notes"
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
